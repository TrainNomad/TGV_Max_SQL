name: Ingestion Quotidienne TGV Max

on:
  schedule:
    # Exécution tous les jours à 4h00 UTC (soit 5h00 ou 6h00 heure française)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet aussi de déclencher le script manuellement depuis GitHub

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Exécuter l'ingestion des données TGV Max
      run: |
        python ingest_tgvmax.py

    - name: Commit et Push de la base de données mise à jour
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add tgvmax_compact.db
        git commit -m "Auto-update: Mise à jour quotidienne de la base TGV Max" || exit 0
        git push